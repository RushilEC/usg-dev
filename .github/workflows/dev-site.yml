name: Build USG dev site
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *"   # refresh from Squarespace every 4 hours
  workflow_dispatch: {}      # "Run workflow" button for an instant refresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install playwright tinycss2
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix src/tests
      - run: python src/tests/run_all.py
      - name: Built files match src/ (run python3 src/build.py and commit)
        run: git diff --exit-code -- header.html footer.html dist/
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python mirror.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
