<script>
(function(){"use strict";
const SHELL="<header class=\"top\" id=\"hdr\">\n  <div class=\"wrap bar\">\n    <a class=\"logo\" href=\"/\" aria-label=\"Princeton Undergraduate Student Government home\"><span class=\"logo-badge\" id=\"logoBadge\" hidden><img id=\"logoImg\" alt=\"\"></span><b class=\"xw\" id=\"logoText\">USG</b><span>Princeton Undergraduate Student Government</span></a>\n    <nav class=\"main\" aria-label=\"Main\"><ul id=\"navList\"></ul></nav>\n    <a class=\"pill\" href=\"mailto:usg@princeton.edu\">Email us</a>\n    <button class=\"pill burger\" id=\"burger\" aria-expanded=\"false\" aria-controls=\"drawer\">Menu</button>\n  </div>\n</header>\n<div class=\"drawer\" id=\"drawer\">\n  <div class=\"dh\"><b class=\"xw\" style=\"font-size:2rem\">USG</b><button class=\"pill\" id=\"dclose\">Close</button></div>\n  <div id=\"drawerNav\"></div>\n</div>\n\n<main>\n<!-- HOME -->\n<div class=\"view\" id=\"v-home\">\n  <section class=\"hero\" data-band>\n    <svg class=\"stripes\" viewBox=\"0 0 600 900\" preserveAspectRatio=\"xMaxYMid slice\" aria-hidden=\"true\"><path d=\"M600 40 C470 60 330 30 170 92 C320 86 470 104 600 128Z\"/><path d=\"M600 200 C430 196 300 238 60 330 C280 290 440 290 600 300Z\"/><path d=\"M600 410 C470 420 360 460 220 520 C380 488 500 492 600 500Z\"/><path d=\"M600 560 C400 572 250 640 0 760 C250 680 430 650 600 650Z\"/><path d=\"M600 760 C500 768 410 800 300 850 C430 820 530 822 600 826Z\"/><path d=\"M600 860 C540 864 480 884 420 900 L600 900Z\"/></svg>\n    <a class=\"sticker\" id=\"sticker\" href=\"#visit\">\n      <svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><defs><path id=\"circ\" d=\"M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0\"/></defs><text><textPath href=\"#circ\">FRIST 204 \u2726 TEA \u2726 COFFEE \u2726 SNACKS \u2726 </textPath></text></svg>\n      <span class=\"in\"><span class=\"led\"></span><b class=\"cw\" id=\"st-main\">Frist 204</b> <small id=\"st-sub\">Checking\u2026</small></span>\n    </a>\n    <div class=\"wrap\">\n      <h1 class=\"xw\"><span><i>Serve.</i></span><span><i>Represent.</i></span><span><i>Advocate.</i></span></h1>\n      <div class=\"hero-foot\"><p>The Undergraduate Student Government of Princeton University.</p><a class=\"pill\" href=\"#events\">See what\u2019s on</a></div>\n    </div>\n  </section>\n  <div class=\"marquee\" aria-hidden=\"true\"><div class=\"track cw\" id=\"track\"></div></div>\n  <section class=\"reel\" id=\"reel\" aria-label=\"Princeton USG video\">\n    <div class=\"hero-bg reel-bg\" id=\"heroBg\" aria-hidden=\"true\"></div>\n    <div class=\"reel-tx\"><span class=\"reel-kicker\">Princeton USG</span><h2 class=\"reel-h\">Princeton Undergraduate Student Government</h2></div>\n  </section>\n  <section class=\"s\" id=\"events\"><div class=\"wrap\">\n    <div class=\"sh\"><h2 class=\"xw evHead\">What\u2019s on</h2>\n      <div class=\"ev-tools\"><div class=\"seg\" role=\"group\" aria-label=\"Event view\"><button aria-pressed=\"true\" data-view=\"wall\">Posters</button><button aria-pressed=\"false\" data-view=\"month\">Calendar</button></div>\n      </div></div>\n    <div id=\"evOut\" class=\"evOut\"></div>\n  </div></section>\n  <section class=\"s\" id=\"latest\" hidden><div class=\"wrap\">\n    <div class=\"sh\"><h2 class=\"xw\">Latest from USG</h2><div class=\"ev-tools\"><a class=\"ig-follow\" href=\"https://www.instagram.com/princeton_usg/\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" width=\"20\" height=\"20\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"4.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"17.3\" cy=\"6.7\" r=\"1.3\" fill=\"currentColor\"/></svg>@princeton_usg</a></div></div>\n    <div class=\"ig-grid\" id=\"latestWall\"></div>\n  </div></section>\n  <section class=\"pin-h\" id=\"priorities\"><div class=\"ph-sticky\">\n    <div class=\"wrap sh\"><h2 class=\"xw\">What we\u2019re pushing for</h2><p>The Senate\u2019s policy priorities this term.</p></div>\n    <div class=\"ph-track\" id=\"pri\"></div>\n    <div class=\"wrap\"><div class=\"ph-bar\"><i></i></div></div>\n  </div></section>\n  <section class=\"mission pin-words\" id=\"mission\"><div class=\"pw-sticky\"><div class=\"wrap\">\n    <blockquote>Our mission is to <em>serve</em>, to <em>represent</em>, and to <em>advocate</em> for the student body, both individually and collectively, all while proactively listening, celebrating diversity, and strengthening an inclusive campus community.</blockquote>\n  </div></div></section>\n  <section class=\"s mission\" style=\"padding-top:0\"><div class=\"wrap\">\n    <div class=\"mphoto\" id=\"missionPhoto\" hidden></div>\n    <div class=\"mcols\">\n      <div><h3>Our vision</h3><p>We envision a dynamic community of care. We seek to celebrate students\u2019 diverse ideas and backgrounds, and to support individual and community growth, including through sometimes challenging and uncomfortable dialogue. For us, to lead is to serve; we value active listening, communication, and trust, all towards meaningful transparency. We aspire towards a student body in which students are not only empowered but eager to serve their communities, especially in times of adversity. Above all, we strive towards a community of care: care for ourselves, for each other, and for our community as a whole.</p></div>\n      <div><h3>Administration statement</h3><p>Through policy advocacy and programming initiatives, our mission is to represent the best interests of the student body while fostering an outward-facing USG. By strengthening transparency, proactive outreach, and clear communication, we seek to enhance student understanding of approachable Senate support structures\u2014ensuring that every student feels represented and empowered.</p></div>\n    </div>\n  </div></section>\n  <section class=\"s\" id=\"committees-home\"><div class=\"wrap\">\n    <div class=\"sh\"><h2 class=\"xw\">Committees</h2></div>\n    <div id=\"cgridHome\"></div>\n  </div></section>\n  <section class=\"s\" id=\"do\" style=\"padding-top:0\"><div class=\"wrap\">\n    <div class=\"sh\"><h2 class=\"xw\">Quick links</h2></div>\n    <div class=\"quick\">\n      <a href=\"/projectsboardclubfunding\"><b class=\"xw\">Fund it</b><span>Apply to Projects Board for club event money.</span></a>\n      <a href=\"/sgrcclubapproval\"><b class=\"xw\">Start a club</b><span>Get recognized through SGRC.</span></a>\n      <a href=\"/mentalhealthresources\"><b class=\"xw\">Get support</b><span>Mental health resources on and off campus.</span></a>\n      <a href=\"/elections\"><b class=\"xw\">Run</b><span>Election schedules, rules, and results.</span></a>\n      <a href=\"/committees\"><b class=\"xw\">Join in</b><span>Committees and working groups.</span></a>\n      <a href=\"/budgetreports\"><b class=\"xw\">Follow the money</b><span>Every USG budget report.</span></a>\n    </div>\n  </div></section>\n</div>\n\n<!-- INNER VIEWS share one band -->\n<div class=\"view\" id=\"v-inner\" hidden>\n  <section class=\"band\" data-band>\n    <svg class=\"stripes\" viewBox=\"0 0 600 900\" preserveAspectRatio=\"xMaxYMid slice\" aria-hidden=\"true\"><path d=\"M600 40 C470 60 330 30 170 92 C320 86 470 104 600 128Z\"/><path d=\"M600 200 C430 196 300 238 60 330 C280 290 440 290 600 300Z\"/><path d=\"M600 410 C470 420 360 460 220 520 C380 488 500 492 600 500Z\"/><path d=\"M600 560 C400 572 250 640 0 760 C250 680 430 650 600 650Z\"/><path d=\"M600 760 C500 768 410 800 300 850 C430 820 530 822 600 826Z\"/><path d=\"M600 860 C540 864 480 884 420 900 L600 900Z\"/></svg>\n    <div class=\"wrap\" id=\"bandIn\"></div>\n    <div class=\"band-stickers\" id=\"bandStk\"></div>\n  </section>\n  <div id=\"bandStrip\"></div>\n  <section class=\"content\"><div class=\"wrap\" id=\"innerOut\"></div></section>\n</div>\n</main>\n\n<footer id=\"visit\">\n  <div class=\"wrap\">\n    <div class=\"fgrid\">\n      <div><div class=\"flogo\" id=\"flogo\" hidden><img id=\"flogoImg\" alt=\"Princeton USG\"></div>\n        <h3>Swing by</h3><p style=\"margin:0 0 14px;font-weight:600\">Room 204, Frist Campus Center<br>Princeton, NJ 08544<br>Tea, coffee, and snacks on us.</p>\n        <ul class=\"fhours\" id=\"fhours\"><li data-d=\"0,1,2,3,4\"><span>Sun \u2013 Thu</span><span>4:30 \u2013 7:30 PM</span></li><li data-d=\"5,6\"><span>Fri \u2013 Sat</span><span>2:00 \u2013 5:00 PM</span></li></ul></div>\n      <div><h3>Committees</h3><ul id=\"fcomm\"></ul></div>\n      <div><h3>Senate</h3><ul><li><a href=\"/senate-members\">Members</a></li><li><a href=\"/budgetreports\">Budget reports</a></li><li><a href=\"/usgdocumentsandcharters\">Charters</a></li><li><a href=\"/history\">History</a></li></ul></div>\n      <div><h3>Reach us</h3><ul><li><a href=\"mailto:usg@princeton.edu\">usg@princeton.edu</a></li><li><a href=\"https://www.instagram.com/princeton_usg/\" target=\"_blank\" rel=\"noopener\">@princeton_usg</a></li><li></li></ul></div>\n    </div>\n    <div class=\"bigword xw\" aria-hidden=\"true\">TIGERS</div>\n  </div>\n  <div class=\"wrap fbase\"><span>\u00a9 <span id=\"yr\"></span> Princeton Undergraduate Student Government</span></div>\n</footer>\n\n\n\n\n<div class=\"toast\" id=\"toast\" role=\"status\"></div>\n\n<dialog class=\"lbx\" id=\"lb\"><button class=\"x\" data-close aria-label=\"Close\" style=\"z-index:3\">\u00d7</button><div class=\"lbx-in\"><img id=\"lbImg\" alt=\"\"><p id=\"lbCap\"></p></div></dialog>\n\n\n\n";

/* ---------- Flipbook for scanned documents ---------- */
function initFlips(root){(root||document).querySelectorAll(".flip:not([data-ready])").forEach(el=>new Flip(el))}
class Flip{
  constructor(el){this.el=el;el.dataset.ready=1;this.p=el.dataset.pages.split(",").filter(Boolean);this.n=this.p.length;this.s=0;this.busy=false;
    el.tabIndex=0;el.setAttribute("role","region");el.setAttribute("aria-label",(el.dataset.title||"Document")+", flip through the pages");
    el.innerHTML=`<div class="fb-stage"><div class="fb-book"><div class="fb-page fb-l"><img alt=""></div><div class="fb-page fb-r"><img alt=""></div><div class="fb-spine"></div></div>
      <button class="fb-hit fb-hl" aria-label="Previous page"></button><button class="fb-hit fb-hr" aria-label="Next page"></button></div>
      <div class="fb-ctl"><button class="fb-btn fb-prev" aria-label="Previous page">‹</button><input class="fb-range" type="range" min="0" value="0" aria-label="Jump to page"><span class="fb-count"></span><button class="fb-btn fb-next" aria-label="Next page">›</button><button class="fb-btn fb-max" aria-label="Full screen">⤢</button></div>`;
    this.L=el.querySelector(".fb-l img");this.R=el.querySelector(".fb-r img");this.range=el.querySelector(".fb-range");this.count=el.querySelector(".fb-count");
    const go=d=>this.turn(d);
    el.querySelector(".fb-prev").onclick=()=>go(-1);el.querySelector(".fb-next").onclick=()=>go(1);el.querySelector(".fb-hl").onclick=()=>go(-1);el.querySelector(".fb-hr").onclick=()=>go(1);
    el.querySelector(".fb-max").onclick=()=>{el.classList.toggle("fb-full");document.body.style.overflow=el.classList.contains("fb-full")?"hidden":"";this.draw()};
    el.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape"&&el.classList.contains("fb-full"))el.querySelector(".fb-max").click()});
    this.range.oninput=()=>{this.s=+this.range.value;this.draw()};
    let sx=null;const st=el.querySelector(".fb-stage");st.addEventListener("pointerdown",e=>sx=e.clientX);st.addEventListener("pointerup",e=>{if(sx!=null&&Math.abs(e.clientX-sx)>40)go(e.clientX<sx?1:-1);sx=null});
    this.mq=matchMedia("(max-width:760px)");this.mq.addEventListener("change",()=>{this.s=this.single?this.leftOf():Math.ceil(this.s/2);this.draw()});
    this.draw()}
  get single(){return this.mq.matches||this.el.classList.contains("fb-one")}
  leftOf(){return Math.max(0,2*this.s-1)}
  get max(){return this.single?this.n-1:Math.floor(this.n/2)}
  pair(s){return this.single?[null,s]:[s===0?null:2*s-1,2*s<this.n?2*s:null]}
  async set(img,i){img.closest(".fb-page").classList.toggle("blank",i==null);if(i==null){img.removeAttribute("src");return}img.alt=`Page ${i+1} of ${this.n}`;const u=await mediaURL(this.p[i]).catch(()=>null);if(u)img.src=u}
  draw(){const[l,r]=this.pair(this.s);this.el.classList.toggle("fb-single",this.single);this.set(this.L,l);this.set(this.R,r);
    this.range.max=this.max;this.range.value=this.s;const shown=[l,r].filter(x=>x!=null).map(x=>x+1);
    this.count.textContent=shown.length>1?`Pages ${shown[0]}–${shown[1]} of ${this.n}`:`Page ${shown[0]} of ${this.n}`;
    this.el.querySelector(".fb-prev").disabled=this.s<=0;this.el.querySelector(".fb-next").disabled=this.s>=this.max;
    [1,2].forEach(k=>{const[a,b]=this.pair(Math.min(this.max,this.s+k));[a,b].forEach(i=>i!=null&&mediaURL(this.p[i]).catch(()=>{}))})}
  async turn(d){const ns=this.s+d;if(this.busy||ns<0||ns>this.max)return;
    if(RM){this.s=ns;return this.draw()}
    this.busy=true;const book=this.el.querySelector(".fb-book");const leaf=document.createElement("div");leaf.className="fb-leaf "+(d>0?"to-left":"to-right")+(this.single?" one":"");
    const[cl,cr]=this.pair(this.s),[nl,nr]=this.pair(ns);
    const front=d>0?cr:cl,back=d>0?nl:nr;
    leaf.innerHTML=`<div class="fb-face front"><img alt=""></div><div class="fb-face back"><img alt=""></div>`;
    const fi=leaf.querySelector(".front img"),bi=leaf.querySelector(".back img");
    await Promise.all([front!=null?mediaURL(this.p[front]).then(u=>fi.src=u).catch(()=>{}):0,back!=null&&!this.single?mediaURL(this.p[back]).then(u=>bi.src=u).catch(()=>{}):0]);
    book.appendChild(leaf);
    if(this.single){await this.set(this.R,nr)}else{if(d>0)await this.set(this.R,nr);else await this.set(this.L,nl)}
    requestAnimationFrame(()=>leaf.classList.add("go"));
    setTimeout(()=>{this.s=ns;this.draw();leaf.remove();this.busy=false},this.single?520:720)}
}

/* ---------- Mobile + "no inner scroll" motion ----------
   Phones get swipe/tap-friendly versions of the scroll effects. And when the page is
   shown inside an app that scrolls the frame itself (so this page never sees a scroll
   event), effects switch to visibility-based triggers that work in any viewer. */
const MOB=matchMedia("(max-width:760px)");
let scrollSeen=false;addEventListener("scroll",()=>{if(scrollY>0)scrollSeen=true},{passive:true});
function checkNoScroll(){const ns=document.documentElement.scrollHeight<=innerHeight+4;document.documentElement.classList.toggle("noscroll",ns&&!scrollSeen)}
function mobileFX(){
  const tr=$("#pri");
  if(tr&&!tr._dots){const cards=[...tr.children];const dots=document.createElement("div");dots.className="ph-dots";dots.setAttribute("aria-hidden","true");dots.innerHTML=cards.map(()=>"<i></i>").join("");tr.after(dots);tr._dots=dots;
    const io2=new IntersectionObserver(es=>es.forEach(e=>{const on=e.intersectionRatio>.55;e.target.classList.toggle("on",on);const i=cards.indexOf(e.target);if(dots.children[i])dots.children[i].classList.toggle("on",on)}),{root:tr,threshold:[0,.55,1]});
    cards.forEach(c=>io2.observe(c));
    const hint=new IntersectionObserver(es=>{if(es[0].isIntersecting&&(MOB.matches||document.documentElement.classList.contains("noscroll"))&&!RM){hint.disconnect();setTimeout(()=>{tr.scrollTo({left:90,behavior:"smooth"});setTimeout(()=>tr.scrollTo({left:0,behavior:"smooth"}),650)},400)}},{threshold:.6});hint.observe(tr)}
  document.querySelectorAll(".pin-words").forEach(sec=>{if(sec._seq)return;sec._seq=1;const bq=sec.querySelector("blockquote");
    const io3=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;if(!document.documentElement.classList.contains("noscroll"))return;io3.disconnect();
      const w=[...sec.querySelectorAll(".w")];w.forEach((s,i)=>setTimeout(()=>s.classList.add("lit"),RM?0:250+i*65))}),{threshold:.3});io3.observe(bq)})}

/* "2025: Fall & Spring Budget" / "March 2nd — Agenda & Packet" -> a label + rounded chips */
const ROW_RE=/^\s*((?:\d{4}(?:\s*[–-]\s*\d{2,4})?)|(?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,\s*\d{4})?))\s*[:—–-]+\s*/i;
function docRows(root){root.querySelectorAll(".prose p").forEach(p=>{if(p.closest(".docrow"))return;const links=[...p.querySelectorAll("a")];if(!links.length)return;
    const txt=p.textContent;const m=txt.match(ROW_RE);if(!m)return;
    const label=m[1].trim();const tail=txt.replace(ROW_RE,"").replace(/[&,]/g," ").trim();
    const leftover=tail;let rest=leftover;links.forEach(a=>{rest=rest.replace(a.textContent.trim(),"")});rest=rest.replace(/\s+/g," ").trim();
    const row=document.createElement("div");row.className="docrow";
    row.innerHTML=`<span class="dr-label">${esc(label)}</span><span class="dr-chips"></span>${rest&&rest.length<30?`<span class="dr-note">${esc(rest)}</span>`:""}`;
    const box=row.querySelector(".dr-chips");
    links.forEach(a=>{const c=a.cloneNode(true);c.textContent=a.textContent.trim();c.className="chip-link"+(a.dataset.file?" is-file":"");box.appendChild(c)});
    const li=p.parentElement&&p.parentElement.tagName==="LI"&&p.parentElement.children.length===1?p.parentElement:null;
    if(li){li.classList.add("li-row");li.replaceChildren(row)}else p.replaceWith(row)});
  /* lists made entirely of rows: drop the bullets */
  root.querySelectorAll(".prose ul,.prose ol").forEach(ul=>{const lis=[...ul.children];if(lis.length&&lis.every(li=>li.classList.contains("li-row")||li.querySelector(":scope>p>a.file.solo:only-child")))ul.classList.add("rows")})}
/* in-page "Contents" links whose targets lost their ids: match by heading text */
function inPageLinks(root){root.querySelectorAll('.prose a[href^="#"]').forEach(a=>{const h=a.getAttribute("href").slice(1);
  if(/^(p-|c-|e-|edit-)|^(home|committees|admin|events|priorities|mission|do|visit|committees-home)$/.test(h))return;
  const want=a.textContent.replace(/^[\s\-–—•]+/,"").trim().toLowerCase().slice(0,40);
  a.addEventListener("click",ev=>{ev.preventDefault();const t=[...root.querySelectorAll(".prose h2,.prose h3,.prose h4")].find(x=>x!==a.closest("h2,h3,h4")&&x.textContent.trim().toLowerCase().startsWith(want.slice(0,24)));

let SQV=null;
function sqsVideo(){if(SQV)return SQV;const root=document.getElementById("usg-root");const found={hls:"",mp4:"",yt:"",vimeo:""};
  const els=[...document.querySelectorAll('[class*="video-background"],[class*="videoBackground"],.section-background,.banner-thumbnail-wrapper,[data-config-video],[data-config-native-video],[data-config-url],[data-video-url],video[src*="squarespace"],video source[src*="squarespace"]')].filter(e=>!(root&&root.contains(e)));

    const h=html.match(/https?:\/\/[^"'\s<>]+?\.m3u8[^"'\s<>]*/i);if(h&&!found.hls)found.hls=h[0];
    const m=html.match(/https?:\/\/[^"'\s<>]+?\.mp4[^"'\s<>]*/i);if(m&&!found.mp4)found.mp4=m[0];
    const vm=html.match(/vimeo\.com\/(?:video\/)?(\d{5,})/);if(vm&&!found.vimeo)found.vimeo=vm[1];
    const y=html.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);if(y&&!found.yt)found.yt=y[1]});

function renderVideo(){const bg=$("#heroBg");if(!bg)return;const reel=bg.closest(".reel");

  reel.classList.add("video-on");

  /* 1st choice: the video file uploaded to Squarespace (same site, always autoplays). 2nd: YouTube, forced to play muted. */
  const tryFile=()=>new Promise(res=>{if(!VIDEO.file&&!sqsVideo().hls&&!sqsVideo().mp4)return res(false);const v=document.createElement("video");
    v.muted=true;v.defaultMuted=true;v.setAttribute("muted","");v.autoplay=true;v.loop=true;v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("webkit-playsinline","");
    v.preload="auto";if(VIDEO.poster)v.poster=VIDEO.poster;v.disablePictureInPicture=true;v.setAttribute("disableremoteplayback","");v.controls=false;
    let settled=false;const done=ok=>{if(!settled){settled=true;res(ok)}};
    const play=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{if(v.paused)reel.classList.remove("vid-playing")})};
    v.addEventListener("playing",()=>reel.classList.add("vid-playing"));
    v.addEventListener("pause",()=>reel.classList.remove("vid-playing"));
    if(VIDEO.poster)reel.style.setProperty("--reel-still",`url("${VIDEO.poster}")`);

    const small=matchMedia("(max-width:900px)").matches||matchMedia("(pointer:coarse)").matches;
    const sq=sqsVideo();const hlsOK=!!v.canPlayType("application/vnd.apple.mpegurl");

  /* the band streams the same YouTube embed as the Squarespace banner, shown only once the player says it is actually playing */
  const youtube=id=>{bg.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&rel=0&playsinline=1&disablekb=1&iv_load_policy=3&modestbranding=1&fs=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="" tabindex="-1" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;on();

    const nudge=()=>{send({event:"listening",id:1,channel:"widget"});send({event:"command",func:"mute",args:[]});send({event:"command",func:"playVideo",args:[]})};
    f.addEventListener("load",()=>{nudge();let n=0;const t=setInterval(()=>{nudge();if(++n>20)clearInterval(t)},700)});
    new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&nudge()),{threshold:.05}).observe(reel);

    const f=bg.querySelector("iframe");const post=o=>{try{f.contentWindow.postMessage(JSON.stringify(o),"*")}catch(e){}};

function fitWord(){$$(".bigword").forEach(el=>{el.style.fontSize="";const cs=parseFloat(getComputedStyle(el).fontSize);el.style.whiteSpace="nowrap";
  const box=el.clientWidth;const span=el._s||(el._s=(()=>{const sp=document.createElement("span");sp.style.display="inline-block";while(el.firstChild)sp.appendChild(el.firstChild);el.appendChild(sp);return sp})());
  const w=span.getBoundingClientRect().width;if(w>box&&w>0)el.style.fontSize=(cs*box/w*0.98)+"px"})}
let _fw;addEventListener("resize",()=>{clearTimeout(_fw);_fw=setTimeout(fitWord,150)});
/* Squarespace's cookie notice: keep it working, dress it in the new style. It can appear after load, so watch for it. */
function styleCookie(){const root=$("#usg-root");
  [...document.querySelectorAll('[class*="cookie"],[id*="cookie"]')].filter(el=>!(root&&root.contains(el))&&!el.closest(".usg-cookie")&&!/^(BUTTON|A|INPUT|P|SPAN)$/.test(el.tagName)).forEach(el=>{if(el.closest(".usg-cookie"))return;
    const cs=getComputedStyle(el),bg=cs.backgroundColor,r=el.getBoundingClientRect();
    const painted=bg&&bg!=="transparent"&&!/rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(bg);
    if(painted&&r.width>0&&r.height>0&&r.height<innerHeight*0.6){el.classList.add("usg-cookie");
      el.querySelectorAll("button,a,[role=button],input[type=button],input[type=submit]").forEach(b=>b.classList.add("usg-cookie-btn"))}})}
new MutationObserver(()=>styleCookie()).observe(document.documentElement,{childList:true,subtree:true});
/* Anything the template still draws above the new header (a bar, a border, an empty strip): find it and remove it. */
function clearTop(){const root=$("#usg-root");if(!root||scrollY>2)return;const found=[];
  [0.02,0.25,0.5,0.75,0.98].forEach(fx=>[2,20].forEach(y=>{(document.elementsFromPoint(innerWidth*fx,y)||[]).forEach(el=>{
    if(el===document.documentElement||el===document.body||root.contains(el)||found.includes(el))return;const top=el.closest("body>*")||el;
    if(/cookie|lightbox|modal/i.test((top.className||"")+(top.id||"")))return;top.style.setProperty("display","none","important");found.push(el)})}));
  const off=root.getBoundingClientRect().top+scrollY;
  if(off>1){root.style.setProperty("margin-top",(-off)+"px","important");console.info("USG skin: closed a "+Math.round(off)+"px gap above the header")}
  if(found.length)console.info("USG skin: hid template elements at the top of the page",found)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();

})();
</script>
