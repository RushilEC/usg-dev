function stickerField(slug,where){const th=THEMES[slug];if(!th||RM&&where==="band")return"";
  const spots=where==="band"?[[60,40,-14,.10],[78,34,10,.18],[68,70,-6,.06],[88,66,16,.22]]:[[96,42,12,.12],[93,78,-8,.2],[-8,30,-10,.08],[-7,72,8,.16]];

function themeStrip(slug){const th=THEMES[slug];if(!th)return"";const w=[...th.words,...th.words].map(x=>`<span>${esc(x)}</span>`).join("");return `<div class="cm-strip" style="--acc:${th.acc};--acc2:${th.acc2}"><div class="cm-strip-in">${w}${w}</div></div>`}

/* drag stickers */
document.addEventListener("pointerdown",e=>{const s=e.target.closest(".sticker-x");if(!s)return;e.preventDefault();s.setPointerCapture(e.pointerId);s.classList.add("grab");
  const sx=e.clientX,sy=e.clientY,dx=+(s.dataset.dx||0),dy=+(s.dataset.dy||0);
  const mv=ev=>{s.dataset.dx=dx+ev.clientX-sx;s.dataset.dy=dy+ev.clientY-sy;s.style.setProperty("--dx",s.dataset.dx+"px");s.style.setProperty("--dy",s.dataset.dy+"px")};
  const up=()=>{s.classList.remove("grab");s.removeEventListener("pointermove",mv);s.removeEventListener("pointerup",up);s.removeEventListener("pointercancel",up)};
  s.addEventListener("pointermove",mv);s.addEventListener("pointerup",up);s.addEventListener("pointercancel",up)});

/* ---------- Reveal on scroll ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
function reveal(root){if(RM)return;(root||document).querySelectorAll(".sh,.poster,.orbit,.quick a,.ct-main>*,.ct-card,.prose>*:not(.g-row),.prose .g-row.people figure,.chair,.book,.mcols>div,.upd,.side,.ev-page>*,.cm-photo,.empty").forEach((el,i)=>{if(el.dataset.rv)return;el.dataset.rv=1;el.classList.add("rv");el.style.setProperty("--d",(i%6)*70+"ms");io.observe(el)})}

      <button class="fb-hit fb-hl" aria-label="Previous page"></button><button class="fb-hit fb-hr" aria-label="Next page"></button></div>
      <div class="fb-ctl"><button class="fb-btn fb-prev" aria-label="Previous page">‹</button><input class="fb-range" type="range" min="0" value="0" aria-label="Jump to page"><span class="fb-count"></span><button class="fb-btn fb-next" aria-label="Next page">›</button><button class="fb-btn fb-max" aria-label="Full screen">⤢</button></div>`;
    this.L=el.querySelector(".fb-l img");this.R=el.querySelector(".fb-r img");this.range=el.querySelector(".fb-range");this.count=el.querySelector(".fb-count");
    const go=d=>this.turn(d);
    el.querySelector(".fb-prev").onclick=()=>go(-1);el.querySelector(".fb-next").onclick=()=>go(1);el.querySelector(".fb-hl").onclick=()=>go(-1);el.querySelector(".fb-hr").onclick=()=>go(1);
    el.querySelector(".fb-max").onclick=()=>{el.classList.toggle("fb-full");document.body.style.overflow=el.classList.contains("fb-full")?"hidden":"";this.draw()};
    el.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape"&&el.classList.contains("fb-full"))el.querySelector(".fb-max").click()});

    this.range.max=this.max;this.range.value=this.s;const shown=[l,r].filter(x=>x!=null).map(x=>x+1);

    this.el.querySelector(".fb-prev").disabled=this.s<=0;this.el.querySelector(".fb-next").disabled=this.s>=this.max;

    const label=m[1].trim();const tail=txt.replace(ROW_RE,"").replace(/[&,]/g," ").trim();
    const leftover=tail;let rest=leftover;links.forEach(a=>{rest=rest.replace(a.textContent.trim(),"")});rest=rest.replace(/\s+/g," ").trim();

function stripCode(R){R.querySelectorAll("script,style,noscript,template,link").forEach(x=>x.remove());

     .replace(/the Lifeline \(National Suicide Prevention (Hotline|Lifeline)\)/gi,"the 988 Suicide & Crisis Lifeline").replace(/National Suicide Prevention (Hotline|Lifeline)/gi,"988 Suicide & Crisis Lifeline");

/* follow Squarespace's own alignment: centered blocks stay centered and the design matches them */
function alignment(M){

  const isC=el=>{const cls=el.className||"";if(/text-align--center|sqsrte-text-align--center/.test(cls)||/text-align:\s*center/i.test(el.getAttribute("style")||""))return true;

  M.querySelectorAll("h1,h2,h3,h4,h5,p,blockquote").forEach(el=>{if(el.closest(".sm-grid,.sq-cardgrid,.books,.docrow,.wall,.usg-done,form,.chip-list"))return;if(isC(el))el.classList.add("is-center")});

/* rows of side-by-side "heading + text" columns (Fall / Winter / Spring...) become one grid of matching cards */

  const flush=()=>{if(run.length>=2){const g=document.createElement("div");g.className="sq-cardgrid";run[0].row.parentNode.insertBefore(g,run[0].row);
      run.forEach(x=>g.appendChild(x.col));run.forEach(x=>{if(x.row.isConnected&&!x.row.textContent.trim())x.row.remove()})}run=[]};
  rows.forEach(r=>{const cols=[...r.children].filter(c=>/sqs-col/.test(c.className)&&c.textContent.trim());
    const tag=c=>{const first=c.querySelector("h1,h2,h3,h4,p,ul,ol,hr");return first&&first.tagName};
    const ok=cols.length>=1&&cols.every(c=>/^H[2-4]$/.test(tag(c)||"")&&c.querySelectorAll("h1,h2,h3,h4").length===1&&!c.querySelector("img,iframe,form,video,.flip,.sm-grid,.wall,.books")&&c.textContent.trim().length<1200);

    if(ok&&same&&(cols.length>=2||run.length))cols.forEach(c=>run.push({row:r,col:c}));else{flush();if(ok&&same&&cols.length>=2)cols.forEach(c=>run.push({row:r,col:c}))}});

/* photos with "Role / Name" captions (class officers, staff...) become the same cards as Senate Members */

    const parts=t.textContent.split("\n").map(x=>x.trim()).filter(Boolean);if(parts.length<2||parts.length>4||parts.join(" ").length>110)return;
    if(/[.!?]$/.test(parts[0])||parts[0].split(" ").length>7)return;

  if(people.length<2)return;

  <h3 class="xw" style="font-variation-settings:'wdth' 100">${esc(e.title)}</h3><div class="meta">${esc(e.start?fmtTime(e.start):"")}${e.start&&e.location?", ":""}${esc(e.location||"")}</div></a>`}
function renderMonth(out){const{y,m}=mCur,today=nowNJ().iso,first=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();let cells="";
  for(let i=0;i<Math.ceil((first+dim)/7)*7;i++){const dt=new Date(Date.UTC(y,m,i-first+1)),iso=dt.toISOString().slice(0,10),o=dt.getUTCMonth()!==m;
    cells+=`<div class="day${o?" out":""}${iso===today?" today":""}"><span class="n">${dt.getUTCDate()}</span>${EVENTS.filter(e=>e.date===iso).map(e=>`<a class="chip" href="${esc(e.url||"#")}" title="${esc(e.title)}">${esc(e.start?fmtTime(e.start)+" ":"")}${esc(e.title)}</a>`).join("")}</div>`}
  out.innerHTML=`<div class="month"><div class="mhead"><button type="button" class="mP" aria-label="Previous month">‹</button><h3 class="xw">${MONL[m]} ${y}</h3><button type="button" class="mN" aria-label="Next month">›</button></div><div class="grid7">${DAYS.map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div></div>`;
  out.querySelector(".mP").onclick=()=>{mCur=m?{y,m:m-1}:{y:y-1,m:11};renderEvents()};out.querySelector(".mN").onclick=()=>{mCur=m<11?{y,m:m+1}:{y:y+1,m:0};renderEvents()}}
function renderEvents(){const cutoff=daysAgo(7),live=EVENTS.filter(e=>(e.endDate||e.date)>=cutoff),old=EVENTS.filter(e=>(e.endDate||e.date)<cutoff).reverse();
  const homeSec=$("#events");if(homeSec)homeSec.hidden=!live.length;
  const today=nowNJ().iso;const up=live.slice(0,8);
  const items=up.length?up.map(e=>`${MON[+e.date.slice(5,7)-1]} ${+e.date.slice(8)} ${e.title}${e.location?" @ "+e.location:""}`):["Frist 204 is open seven days a week","Tea, coffee, and snacks on us","Questions? usg@princeton.edu","Serve. Represent. Advocate."];
  const h=items.map(t=>`<span>${esc(t)}</span>`).join("");$("#track").innerHTML=h+h;
  $$(".evOut").forEach(out=>{if(!out.offsetParent&&out.id!=="evOut")return;const onPage=out.id!=="evOut";
    if(evView==="month"&&onPage){renderMonth(out);return}

/* Working groups are found by their "Mission" sub-heading: the group's name is the heading (any size)

function parseGroups(M){stripCode(M);
  M.querySelectorAll("h1,h2,h3,h4,h5,h6,p,li").forEach(e=>{if(!/chairs?\s*\(\s*\)/i.test(e.textContent.replace(/\u00a0/g," ")))return;

  const txt=e=>e.textContent.replace(/\s+/g," ").trim();
  const isTitleP=e=>e.tagName==="P"&&txt(e).length>1&&txt(e).length<70&&(()=>{const b=e.querySelector("strong,b");return b&&txt(b)===txt(e)})();
  const isName=e=>(isH(e)||isTitleP(e))&&!SUB.test(txt(e).replace(/[:\s]+$/,""))&&!/^about\b|working groups?:?$/i.test(txt(e));

  heads.forEach((h,k)=>{const name=txt(h).replace(/:\s*$/,"");const start=els.indexOf(h),end=k+1<heads.length?els.indexOf(heads[k+1]):els.length;

  const box=el.clientWidth;const span=el._s||(el._s=(()=>{const sp=document.createElement("span");sp.style.display="inline-block";while(el.firstChild)sp.appendChild(el.firstChild);el.appendChild(sp);return sp})());
  const w=span.getBoundingClientRect().width;if(w>box&&w>0)el.style.fontSize=(cs*box/w*0.98)+"px"})}
let _fw;addEventListener("resize",()=>{clearTimeout(_fw);_fw=setTimeout(fitWord,150)});
/* Squarespace's cookie notice: keep it working, dress it in the new style. It can appear after load, so watch for it. */
function styleCookie(){const root=$("#usg-root");
  [...document.querySelectorAll('[class*="cookie"],[id*="cookie"]')].filter(el=>!(root&&root.contains(el))&&!el.closest(".usg-cookie")&&!/^(BUTTON|A|INPUT|P|SPAN)$/.test(el.tagName)).forEach(el=>{if(el.closest(".usg-cookie"))return;
    const cs=getComputedStyle(el),bg=cs.backgroundColor,r=el.getBoundingClientRect();
    const painted=bg&&bg!=="transparent"&&!/rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(bg);
    if(painted&&r.width>0&&r.height>0&&r.height<innerHeight*0.6){el.classList.add("usg-cookie");
      el.querySelectorAll("button,a,[role=button],input[type=button],input[type=submit]").forEach(b=>b.classList.add("usg-cookie-btn"))}})}
new MutationObserver(()=>styleCookie()).observe(document.documentElement,{childList:true,subtree:true});
/* Anything the template still draws above the new header (a bar, a border, an empty strip): find it and remove it. */
function clearTop(){const root=$("#usg-root");if(!root||scrollY>2)return;const found=[];
  [0.02,0.25,0.5,0.75,0.98].forEach(fx=>[2,20].forEach(y=>{(document.elementsFromPoint(innerWidth*fx,y)||[]).forEach(el=>{
    if(el===document.documentElement||el===document.body||root.contains(el)||found.includes(el))return;const top=el.closest("body>*")||el;
    if(/cookie|lightbox|modal/i.test((top.className||"")+(top.id||"")))return;top.style.setProperty("display","none","important");found.push(el)})}));
  const off=root.getBoundingClientRect().top+scrollY;
  if(off>1){root.style.setProperty("margin-top",(-off)+"px","important");console.info("USG skin: closed a "+Math.round(off)+"px gap above the header")}
  if(found.length)console.info("USG skin: hid template elements at the top of the page",found)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();

})();
</script>
